[package]
name = "naby-win"
description = "NabyScape Windows host: Win32 windows, WinRT media, WASAPI audio and system services"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nabyscape"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
naby-core.workspace = true
naby-render.workspace = true
naby-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
png.workspace = true
jpeg-encoder = { version = "0.6", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Accessibility", "Win32_UI_Input_Ime",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Power", "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Variant", "Win32_System_Wmi", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Credentials",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_Devices_FunctionDiscovery", "Win32_Devices_Display", "Win32_UI_Shell_PropertiesSystem",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Pipes",
  "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Media_SpeechRecognition",
  "Media_SpeechSynthesis", "Globalization", "ApplicationModel", "Win32_System_Rpc",
] }

